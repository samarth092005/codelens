[project]
name = "codelens-backend"
version = "0.1.0"
description = "Backend for the CodeLens codebase intelligence platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
